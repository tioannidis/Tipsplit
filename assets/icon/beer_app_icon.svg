<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient für das Bier -->
    <linearGradient id="beerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient für den Schaum -->
    <linearGradient id="foamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient für das Glas -->
    <linearGradient id="glassGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:0.3" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#E5E7EB;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Hintergrund -->
  <rect width="256" height="256" rx="45" fill="#1F2937"/>
  
  <!-- Bierglas Grundform -->
  <path d="M80 240 L80 100 Q80 90 90 90 L166 90 Q176 90 176 100 L176 240 Q176 250 166 250 L90 250 Q80 250 80 240 Z" 
        fill="url(#glassGradient)" 
        stroke="#9CA3AF" 
        stroke-width="2"/>
  
  <!-- Bier im Glas -->
  <path d="M85 235 L85 130 Q85 125 90 125 L166 125 Q171 125 171 130 L171 235 Q171 240 166 240 L90 240 Q85 240 85 235 Z" 
        fill="url(#beerGradient)"/>
  
  <!-- Bierschaum -->
  <ellipse cx="128" cy="125" rx="46" ry="20" fill="url(#foamGradient)"/>
  <ellipse cx="110" cy="115" rx="25" ry="15" fill="url(#foamGradient)"/>
  <ellipse cx="145" cy="118" rx="30" ry="12" fill="url(#foamGradient)"/>
  <ellipse cx="128" cy="108" rx="35" ry="18" fill="url(#foamGradient)"/>
  <ellipse cx="115" cy="95" rx="20" ry="12" fill="url(#foamGradient)"/>
  <ellipse cx="140" cy="98" rx="25" ry="15" fill="url(#foamGradient)"/>
  
  <!-- Glasreflektion -->
  <path d="M95 100 Q95 95 100 95 L110 95 Q115 95 115 100 L115 220 Q115 225 110 225 L105 225 Q100 225 100 220 L100 105 Q100 100 95 100 Z" 
        fill="url(#glassGradient)" 
        opacity="0.4"/>
  
  <!-- Henkel -->
  <path d="M176 130 Q200 130 200 155 L200 180 Q200 205 176 205" 
        fill="none" 
        stroke="#9CA3AF" 
        stroke-width="8" 
        stroke-linecap="round"/>
  
  <!-- Henkel Innenreflektion -->
  <path d="M180 140 Q190 140 190 155 L190 180 Q190 195 180 195" 
        fill="none" 
        stroke="#E5E7EB" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.6"/>
  
  <!-- Blasen im Bier -->
  <circle cx="110" cy="180" r="3" fill="#FBBF24" opacity="0.7"/>
  <circle cx="145" cy="200" r="2" fill="#FBBF24" opacity="0.5"/>
  <circle cx="125" cy="170" r="2.5" fill="#FBBF24" opacity="0.6"/>
  <circle cx="155" cy="160" r="2" fill="#FBBF24" opacity="0.4"/>
</svg>