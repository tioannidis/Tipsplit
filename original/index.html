<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tipsplit - Tip Calculator</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-weight: 500;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            border-color: #667eea;
        }

        .tip-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 25px;
        }

        .tip-btn {
            padding: 12px;
            border: 2px solid #e1e5e9;
            background: white;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tip-btn:hover, .tip-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .results {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .result-item:last-child {
            margin-bottom: 0;
            padding-top: 15px;
            border-top: 2px solid #e1e5e9;
            font-weight: 600;
            font-size: 18px;
        }

        .result-value {
            font-weight: 600;
            color: #667eea;
        }

        .round-btn {
            width: 100%;
            padding: 15px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }

        .round-btn:hover {
            background: #218838;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .tip-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🍽️</div>
            <h1>Tipsplit</h1>
        </div>

        <div class="input-group">
            <label for="bill">Bill Amount ($)</label>
            <input type="number" id="bill" placeholder="25.50" step="0.01" min="0">
        </div>

        <div class="input-group">
            <label>Tip %</label>
            <div class="tip-buttons">
                <button class="tip-btn" data-tip="10">10%</button>
                <button class="tip-btn active" data-tip="15">15%</button>
                <button class="tip-btn" data-tip="18">18%</button>
                <button class="tip-btn" data-tip="20">20%</button>
                <button class="tip-btn" data-tip="25">25%</button>
                <button class="tip-btn" data-tip="custom">Custom</button>
            </div>
        </div>

        <div class="input-group" id="custom-tip" style="display: none;">
            <label for="customTipValue">Custom Tip %</label>
            <input type="number" id="customTipValue" placeholder="12" min="0" max="100">
        </div>

        <div class="input-group">
            <label for="people">Number of People</label>
            <input type="number" id="people" value="1" min="1">
        </div>

        <button class="round-btn" onclick="roundUp()">Round Up to Next Dollar</button>

        <div class="results">
            <div class="result-item">
                <span>Tip Amount:</span>
                <span class="result-value" id="tip-amount">$0.00</span>
            </div>
            <div class="result-item">
                <span>Total Amount:</span>
                <span class="result-value" id="total-amount">$0.00</span>
            </div>
            <div class="result-item">
                <span>Per Person:</span>
                <span class="result-value" id="per-person">$0.00</span>
            </div>
        </div>
    </div>

    <script>
        let currentTipPercent = 15;
        let isRounded = false;

        const billInput = document.getElementById('bill');
        const peopleInput = document.getElementById('people');
        const customTipInput = document.getElementById('customTipValue');
        const customTipDiv = document.getElementById('custom-tip');
        const tipButtons = document.querySelectorAll('.tip-btn');

        function updateCalculation() {
            const bill = parseFloat(billInput.value) || 0;
            const people = parseInt(peopleInput.value) || 1;

            let tipPercent = currentTipPercent;
            if (currentTipPercent === 'custom') {
                tipPercent = parseFloat(customTipInput.value) || 0;
            }

            const tipAmount = (bill * tipPercent) / 100;
            const totalAmount = bill + tipAmount;
            const perPerson = totalAmount / people;

            document.getElementById('tip-amount').textContent = '$' + tipAmount.toFixed(2);
            document.getElementById('total-amount').textContent = '$' + totalAmount.toFixed(2);
            document.getElementById('per-person').textContent = '$' + perPerson.toFixed(2);

            isRounded = false;
        }

        function roundUp() {
            const bill = parseFloat(billInput.value) || 0;
            if (bill === 0) return;

            const people = parseInt(peopleInput.value) || 1;
            let tipPercent = currentTipPercent;
            if (currentTipPercent === 'custom') {
                tipPercent = parseFloat(customTipInput.value) || 0;
            }

            const tipAmount = (bill * tipPercent) / 100;
            const totalAmount = bill + tipAmount;
            const roundedTotal = Math.ceil(totalAmount);
            const newTipAmount = roundedTotal - bill;
            const perPerson = roundedTotal / people;

            document.getElementById('tip-amount').textContent = '$' + newTipAmount.toFixed(2);
            document.getElementById('total-amount').textContent = '$' + roundedTotal.toFixed(2);
            document.getElementById('per-person').textContent = '$' + perPerson.toFixed(2);

            isRounded = true;
        }

        tipButtons.forEach(button => {
            button.addEventListener('click', () => {
                tipButtons.forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');

                const tipValue = button.dataset.tip;
                if (tipValue === 'custom') {
                    currentTipPercent = 'custom';
                    customTipDiv.style.display = 'block';
                } else {
                    currentTipPercent = parseInt(tipValue);
                    customTipDiv.style.display = 'none';
                }

                updateCalculation();
            });
        });

        billInput.addEventListener('input', updateCalculation);
        peopleInput.addEventListener('input', updateCalculation);
        customTipInput.addEventListener('input', updateCalculation);

        updateCalculation();
    </script>
</body>
</html>
